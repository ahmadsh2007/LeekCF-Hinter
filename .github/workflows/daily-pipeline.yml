# Runs scripts/daily.sh every day: detect new problems, scrape them, link duplicates, find tutorials, generate hints,
# save the API's usage statistics. It does nothing until the repository variable PIPELINE_ENABLED=true exists (or you
# start it by hand from the Actions tab). scripts/setup-github-automation.sh creates every secret and variable.
# It starts at 08:15 UTC, just after Google resets the free daily model quotas (midnight US Pacific is 07:00 UTC, or
# 08:00 UTC when the US clocks go back), so one run uses the whole day's quota. HINT_LIMIT bounds the run's length.
# Not yet run on GitHub: its servers may be refused by Codeforces (Cloudflare); look at the first manual run's log.
name: Daily pipeline

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PIPELINE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      PYTHON: python
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
      SUPABASE_DATABASE_SECRET_KEY: ${{ secrets.SUPABASE_DATABASE_SECRET_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SCRAPE_LIMIT: ${{ vars.SCRAPE_LIMIT }}
      TUTORIAL_CONTEST_LIMIT: ${{ vars.TUTORIAL_CONTEST_LIMIT }}
      HINT_LIMIT: ${{ vars.HINT_LIMIT }}
      INCLUDE_WITHOUT_TUTORIAL: ${{ vars.INCLUDE_WITHOUT_TUTORIAL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: npm ci
      - run: pip install -r requirements.txt
      - run: scripts/daily.sh
      # A stage that is blocked or out of model quota stops quietly, so a green run can still have produced nothing.
      # This report is shown at the top of the run's page, and makes the run fail (GitHub then emails you) when hints
      # are waiting but none was written for a day, or statements stay unscraped for days.
      - name: Status report
        if: always()
        run: python -u -m src.workers.status.pipelineStatus --strict --append-to "$GITHUB_STEP_SUMMARY"
